[package]
name = "xtask"
version.workspace = true
edition.workspace = true

[dependencies]
evdev = "0.13.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
phonepad-core = { path = "../phonepad-core" }
phonepad-h264 = { path = "../phonepad-h264" }
rustix = { version = "1.1.6", features = ["event", "fs"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
tungstenite = "0.29"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
wtransport = { version = "0.7.2", features = ["self-signed", "quinn"] }

[lints]
workspace = true
