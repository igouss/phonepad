[package]
name = "phonepad-h264"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "filter", "format"] }
ffmpeg-sys-next = { version = "9.0.0", default-features = false, features = ["avcodec", "avfilter", "avformat"] }
thiserror = "2.0.17"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
