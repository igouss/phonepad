[package]
name = "phonepad"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
evdev = "0.13.2"
phonepad-core = { path = "../phonepad-core" }
phonepad-h264 = { path = "../phonepad-h264" }
rustix = { version = "1.1.6", features = ["event", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
xkbcommon = { version = "0.8.0", default-features = false }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
