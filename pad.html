<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>phonepad</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#111111">
<style>
  :root { --bg:#111; --pad:#1b1b1b; --fg:#ddd; --btn:#2a2a2a; --on:#3d6; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100dvh; background:var(--bg); color:var(--fg); font:16px system-ui, sans-serif;
    overscroll-behavior:none; touch-action:none; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  #status { position:absolute; z-index:1; top:8px; right:12px; font-size:12px; opacity:.6; pointer-events:none; }
  #pad { flex:1; margin:8px 24px 0; background:var(--pad); border-radius:16px; touch-action:none; position:relative; overflow:hidden; }
  #view { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .row { display:flex; gap:6px; margin:6px 24px 0; }
  .row button { flex:1; height:52px; border:0; border-radius:10px; background:var(--btn); color:var(--fg); font-size:15px; touch-action:manipulation; }
  .row button.on { background:var(--on); color:#000; }
  #mouse button { height:64px; }
  #keys { margin-bottom:8px; }
  #kbd { position:fixed; left:0; bottom:0; width:1px; height:1px; opacity:0; border:0; padding:0; }
</style>
</head>
<body>
<div id="status">connecting…</div>
<div id="pad"><canvas id="view"></canvas></div>
<div class="row" id="mouse">
  <button data-btn="left">L</button><button data-btn="middle">M</button><button data-btn="right">R</button>
</div>
<div class="row">
  <button data-mod="KEY_LEFTCTRL">Ctrl</button><button data-mod="KEY_LEFTALT">Alt</button>
  <button data-mod="KEY_LEFTSHIFT">Shift</button><button data-mod="KEY_LEFTMETA">Super</button>
  <button id="zoombtn"></button><button id="kbdbtn">⌨</button>
</div>
<div class="row" id="keys">
  <button data-key="KEY_ESC">Esc</button><button data-key="KEY_TAB">Tab</button>
  <button data-key="KEY_LEFT">←</button><button data-key="KEY_UP">↑</button>
  <button data-key="KEY_DOWN">↓</button><button data-key="KEY_RIGHT">→</button>
  <button data-key="KEY_BACKSPACE">⌫</button><button data-key="KEY_ENTER">⏎</button>
</div>
<input id="kbd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<script src="/pointer.js"></script>
<script>
const SCROLL = 6, TAP_MS = 180, TAP_PX = 8;
const ZOOMS = [1.5, 2.5, 4];
const status = document.getElementById("status");
const pad = document.getElementById("pad");
const view = document.getElementById("view");
const ctx = view.getContext("2d");
const zoombtn = document.getElementById("zoombtn");
let zoom = 2.5;
try { const z = parseFloat(localStorage.getItem("zoom")); if (ZOOMS.includes(z)) zoom = z; } catch (_) {}
let ws = null, seq = 0;
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { status.textContent = "connected"; seq = 0; restart(); sendView(); sendVisible(); };
  ws.onclose = () => { status.textContent = "disconnected"; setTimeout(connect, 1000); };
  ws.onmessage = ev => { if (ev.data instanceof ArrayBuffer) onMessage(ev.data); };
}
const send = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
function sendVisible() { send({ t: "visible", v: document.visibilityState === "visible" }); }
function sendView() {
  const r = pad.getBoundingClientRect();
  view.width = Math.round(r.width * devicePixelRatio);
  view.height = Math.round(r.height * devicePixelRatio);
  send({ t: "view", w: Math.round(r.width * zoom), h: Math.round(r.height * zoom) });
  repaint();
}
let decoder = null, spsId = null, needKey = true, stamp = 0;
const heads = [];
const ack = id => send({ t: "ack", id });
const hex = n => n.toString(16).padStart(2, "0");
function nals(b) {
  const out = [];
  let i = 0, start = -1;
  const close = end => { while (end > start && b[end - 1] === 0) end--; out.push(b.subarray(start, end)); };
  while (i + 2 < b.length) {
    if (b[i] === 0 && b[i + 1] === 0 && b[i + 2] === 1) { if (start >= 0) close(i); i += 3; start = i; }
    else i++;
  }
  if (start >= 0) close(b.length);
  return out;
}
const shot = document.createElement("canvas");
const shotCtx = shot.getContext("2d");
let win = null, cur = null, painting = false, fresh = null;
const ORIENT = [
  (w, h) => [1, 0, 0, 1, 0, 0], (w, h) => [0, 1, -1, 0, h, 0], (w, h) => [-1, 0, 0, -1, w, h], (w, h) => [0, -1, 1, 0, 0, w],
  (w, h) => [-1, 0, 0, 1, w, 0], (w, h) => [0, 1, 1, 0, 0, 0], (w, h) => [1, 0, 0, -1, 0, h], (w, h) => [0, -1, -1, 0, h, w],
];
function paint() {
  painting = false;
  if (!win || !cur) return;
  const W = view.width, H = view.height, r = pad.getBoundingClientRect();
  const { x: vx, y: vy, w: vw, h: vh } = Pointer.place(cur, { w: Math.round(r.width * zoom), h: Math.round(r.height * zoom) }, win);
  const s = Math.min(W / vw, H / vh);
  const ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  ctx.fillStyle = "#1b1b1b"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(shot, vx - win.x, vy - win.y, vw, vh, ox, oy, vw * s, vh * s);
  const px = ox + (cur.x - vx) * s, py = oy + (cur.y - vy) * s, rad = 14 * devicePixelRatio;
  ctx.lineWidth = 5 * devicePixelRatio; ctx.strokeStyle = "rgba(0,0,0,.7)";
  ctx.beginPath(); ctx.arc(px, py, rad, 0, 2 * Math.PI); ctx.stroke();
  ctx.lineWidth = 2.5 * devicePixelRatio; ctx.strokeStyle = "#3d6";
  ctx.beginPath(); ctx.arc(px, py, rad, 0, 2 * Math.PI); ctx.stroke();
  if (fresh) { send({ t: "drawn", id: fresh.id, rx: fresh.rx, dec: fresh.dec, at: performance.now() }); fresh = null; }
}
function repaint() { if (!painting) { painting = true; requestAnimationFrame(paint); } }
function output(frame) {
  try {
    let head = null;
    while (heads.length && heads[0].ts <= frame.timestamp) { head = heads.shift(); ack(head.id); }
    if (head) {
      const bw = frame.displayWidth, bh = frame.displayHeight, turned = head.t % 2 === 1;
      const w = turned ? bh : bw, h = turned ? bw : bh;
      if (shot.width !== w || shot.height !== h) { shot.width = w; shot.height = h; }
      shotCtx.setTransform(...ORIENT[head.t](bw, bh));
      shotCtx.drawImage(frame, 0, 0);
      shotCtx.setTransform(1, 0, 0, 1, 0, 0);
      win = { x: head.wx, y: head.wy, w, h };
      fresh = { id: head.id, rx: head.rx, dec: performance.now() };
      repaint();
    }
  } finally {
    frame.close();
  }
}
function restart() {
  heads.length = 0; spsId = null; needKey = true; fresh = null;
  if (decoder && decoder.state !== "closed") decoder.reset(); else decoder = null;
}
function fail() {
  while (heads.length) ack(heads.shift().id);
  restart();
  send({ t: "key" });
}
function configure(sps, id) {
  while (heads.length) ack(heads.shift().id);
  if (!decoder || decoder.state === "closed") decoder = new VideoDecoder({ output, error: fail });
  else decoder.reset();
  decoder.configure({ codec: "avc1." + hex(sps[1]) + hex(sps[2]) + hex(sps[3]), optimizeForLatency: true, hardwareAcceleration: "prefer-hardware" });
  spsId = id; needKey = true;
}
function onMessage(buf) {
  const rx = performance.now();
  const h = new DataView(buf, 0, Math.min(buf.byteLength, 14));
  if (h.getUint8(0) === 1) { cur = { x: h.getInt32(1), y: h.getInt32(5) }; repaint(); return; }
  const head = { id: h.getUint32(1), wx: h.getInt32(5), wy: h.getInt32(9), t: h.getUint8(13) & 7, ts: stamp, rx };
  const au = new Uint8Array(buf, 14);
  const units = nals(au);
  const key = units.some(n => (n[0] & 31) === 5);
  const sps = units.find(n => (n[0] & 31) === 7);
  try {
    if (key && sps && sps.length > 3) { const id = Array.from(sps, hex).join(""); if (id !== spsId) configure(sps, id); }
    if (!units.length || !decoder || decoder.state !== "configured" || (needKey && !key)) { ack(head.id); return; }
    needKey = false;
    heads.push(head);
    decoder.decode(new EncodedVideoChunk({ type: key ? "key" : "delta", timestamp: stamp++, data: au }));
  } catch (_) {
    if (!heads.includes(head)) ack(head.id);
    fail();
  }
}
function showZoom() { zoombtn.textContent = zoom + "×"; }
zoombtn.addEventListener("click", () => {
  zoom = ZOOMS[(ZOOMS.indexOf(zoom) + 1) % ZOOMS.length];
  try { localStorage.setItem("zoom", String(zoom)); } catch (_) {}
  showZoom(); sendView();
});
showZoom();
connect();

const mods = new Set();
document.querySelectorAll("[data-mod]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.mod;
  mods.has(k) ? mods.delete(k) : mods.add(k);
  b.classList.toggle("on", mods.has(k));
}));
function clearMods() { mods.clear(); document.querySelectorAll("[data-mod]").forEach(b => b.classList.remove("on")); }
function sendKey(k) { send({ t: "keys", k: [...mods, k] }); clearMods(); }
document.querySelectorAll("[data-key]").forEach(b => b.addEventListener("click", () => sendKey(b.dataset.key)));

document.querySelectorAll("[data-btn]").forEach(b => {
  b.addEventListener("pointerdown", ev => { ev.preventDefault(); b.classList.add("on"); send({ t: "button", b: b.dataset.btn, down: 1 }); });
  const up = () => { if (!b.classList.contains("on")) return; b.classList.remove("on"); send({ t: "button", b: b.dataset.btn, down: 0 }); };
  b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("pointerleave", up);
});

function click(b) {
  if (mods.size) { send({ t: "keys", k: [...mods] }); }
  send({ t: "button", b, down: 1 }); send({ t: "button", b, down: 0 });
}

const touches = new Map();
let gesture = null, acc = { x: 0, y: 0, sx: 0, sy: 0 }, dragging = false, lastTapEnd = 0, maxFingers = 0;
pad.addEventListener("touchstart", ev => {
  ev.preventDefault();
  for (const t of ev.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
  if (!gesture) {
    gesture = { start: performance.now(), moved: 0 };
    maxFingers = 0;
    if (performance.now() - lastTapEnd < 250 && touches.size === 1) { dragging = true; send({ t: "button", b: "left", down: 1 }); }
  }
  maxFingers = Math.max(maxFingers, touches.size);
}, { passive: false });
pad.addEventListener("touchmove", ev => {
  ev.preventDefault();
  let dx = 0, dy = 0, n = 0;
  for (const t of ev.changedTouches) {
    const p = touches.get(t.identifier); if (!p) continue;
    dx += t.clientX - p.x; dy += t.clientY - p.y; n++;
    p.x = t.clientX; p.y = t.clientY;
  }
  if (!n) return;
  dx /= n; dy /= n;
  gesture.moved += Math.hypot(dx, dy);
  if (touches.size >= 2) { acc.sx += dx * SCROLL; acc.sy += dy * SCROLL; }
  else { const a = Pointer.accelerate(dx, dy); acc.x += a.x; acc.y += a.y; }
}, { passive: false });
function end(ev) {
  ev.preventDefault();
  for (const t of ev.changedTouches) touches.delete(t.identifier);
  if (touches.size || !gesture) return;
  const tap = performance.now() - gesture.start < TAP_MS && gesture.moved < TAP_PX;
  if (dragging) { send({ t: "button", b: "left", down: 0 }); dragging = false; }
  else if (tap) {
    if (maxFingers >= 3) click("middle");
    else if (maxFingers === 2) click("right");
    else { click("left"); lastTapEnd = performance.now(); }
  }
  gesture = null;
}
pad.addEventListener("touchend", end, { passive: false });
pad.addEventListener("touchcancel", end, { passive: false });

(function flush() {
  const mx = Math.trunc(acc.x), my = Math.trunc(acc.y);
  if (mx || my) { send({ t: "move", dx: mx, dy: my, s: ++seq }); acc.x -= mx; acc.y -= my; }
  const sx = Math.trunc(acc.sx), sy = Math.trunc(acc.sy);
  if (sx || sy) { send({ t: "scroll", dx: sx, dy: sy }); acc.sx -= sx; acc.sy -= sy; }
  requestAnimationFrame(flush);
})();

const kbd = document.getElementById("kbd");
let prev = "";
document.getElementById("kbdbtn").addEventListener("click", () => {
  if (document.activeElement === kbd) { kbd.blur(); return; }
  kbd.value = ""; prev = ""; kbd.focus();
});
kbd.addEventListener("input", () => {
  const now = kbd.value;
  let i = 0;
  while (i < prev.length && i < now.length && prev[i] === now[i]) i++;
  for (let k = 0; k < prev.length - i; k++) send({ t: "keys", k: ["KEY_BACKSPACE"] });
  const added = now.slice(i);
  if (added) {
    if (mods.size) { for (const ch of added) sendKey("KEY_" + ch.toUpperCase()); }
    else send({ t: "text", s: added });
  }
  prev = now;
  if (now.length > 64) { kbd.value = ""; prev = ""; }
});
kbd.addEventListener("keydown", ev => {
  const special = { Enter: "KEY_ENTER", Backspace: "KEY_BACKSPACE", Tab: "KEY_TAB", Escape: "KEY_ESC" };
  if (ev.key === "Enter" || (ev.key === "Backspace" && kbd.value === "")) {
    ev.preventDefault(); sendKey(special[ev.key]); kbd.value = ""; prev = "";
  }
});

function fit() { const v = visualViewport; document.body.style.height = v.height + "px"; scrollTo(0, 0); sendView(); }
visualViewport.addEventListener("resize", fit); fit();
history.pushState(null, "", location.href);
addEventListener("popstate", () => history.pushState(null, "", location.href));
async function wake() { try { await navigator.wakeLock.request("screen"); } catch (_) {} }
wake(); document.addEventListener("visibilitychange", () => { sendVisible(); if (document.visibilityState === "visible") wake(); });
</script>
</body>
</html>
